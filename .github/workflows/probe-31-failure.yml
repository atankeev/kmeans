name: Temporary issue 31 failure probe

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - run: exit 1

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - run: exit 0

  race-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - run: exit 0

  missing-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
    steps:
    - name: Set up stable Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
    - name: Publish absent coverage profile
      run: go tool cover -func=coverage.out > coverage.txt

  missing-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Upload absent coverage profile
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-linux-stable
        path: coverage.out
        retention-days: 30
        if-no-files-found: error

  build:
    name: build
    if: ${{ always() }}
    needs: [compatibility, smoke, race-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every test job to succeed
      env:
        TEST_RESULTS: ${{ toJSON(needs) }}
      run: |
        printf '%s\n' "$TEST_RESULTS"
        jq -e 'all(.[]; .result == "success")' <<< "$TEST_RESULTS"
