version: "2"

run:
  go: "1.24.4"
  tests: true

linters:
  default: none
  enable:
    - errcheck # Handle errors returned by calls.
    - govet # Detect suspicious Go constructs.
    - ineffassign # Remove assignments whose values are never used.
    - staticcheck # Check correctness and simplify idiomatic Go.
    - unused # Remove unreachable declarations.
    - paralleltest # Run independent tests in parallel.
    - testifylint # Use testify assertions correctly.
    - revive # Enforce the selected error naming, message, and flow rules below.
    - predeclared # Keep built-in identifiers available and unambiguous.
    - nolintlint # Require specific, explained, effective suppressions.
    - errorlint # Preserve wrapped-error matching without requiring wrapping.
  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
    errorlint:
      errorf: false
      asserts: true
      comparison: true
    revive:
      enable-all-rules: false
      enable-default-rules: false
      rules:
        - name: error-naming
        - name: error-strings
        - name: indent-error-flow
        - name: redundant-import-alias

formatters:
  enable:
    - goimports
